<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon: Scegli il Cammino</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ee1515' stroke='%23222224' stroke-width='8'/><path d='M4 50 h92' stroke='%23222224' stroke-width='8'/><path d='M4 50 A 46 46 0 0 0 96 50 Z' fill='%23f0f0f0'/><circle cx='50' cy='50' r='14' fill='%23f0f0f0' stroke='%23222224' stroke-width='8'/><circle cx='50' cy='50' r='6' fill='%23222224'/></svg>" />
  <link rel="stylesheet" href="./src/styles.css" />
  <!--
    Questo progetto NON usa un bundler (niente npm install, niente Vite/webpack).
    React e ReactDOM vengono caricati come moduli ES direttamente da una CDN (esm.sh),
    così l'app funziona semplicemente aprendo index.html con un piccolo server statico
    (serve un server perché i moduli ES non si caricano da file://).
    Se in futuro vuoi migrare a un progetto Vite "normale" con npm install,
    tutto il codice sotto src/ è già scritto in componenti React separati ed è
    pronto per essere importato in quel tipo di progetto con modifiche minime.
  -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
